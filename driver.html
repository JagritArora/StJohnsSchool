<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- Prototype: kept out of search results so it never competes with the school's own site. -->
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Driver | St. John's School</title>
<link rel="icon" href="assets/crest.svg" type="image/svg+xml" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="St. John's" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/site.css?v=126" />
<link rel="stylesheet" href="css/feel.css?v=7" />
<link rel="stylesheet" href="css/ease.css?v=6" />
</head>
<body class="app drv">
<div class="proto-bar" id="proto"><b>Prototype</b> · Driver view.</div>
<div class="app-shell">
  <header class="pbar">
    <a class="pbar-brand" href="#" aria-label="St. John's School"><img src="assets/crest.svg" alt="" width="34" height="34" /><span><b>St. John&#x27;s School</b><small>Bus driver</small></span></a>
    <div class="pbar-r"><span class="pbar-who"><span class="avatar" id="who-av"></span><span class="pbar-wt"><b id="who-name"></b><small id="who-title"></small></span></span><a class="icon-btn" href="login.html?role=staff" data-signout aria-label="Sign out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg></a></div>
  </header>
  <main class="main drv-main">
    <!-- The trip: start it, then tap each stop as it's done. No map, no GPS. -->
    <section class="card drv-trip" id="trip" aria-live="polite"></section>
    <section class="card">
      <div class="card-h"><h2>Stops</h2><span class="right muted" id="stops-n" style="font-size:13.5px"></span></div>
      <ol class="drv-stops drv-tap" id="stops"></ol>
    </section>
  </main>
</div>
<script src="js/data.js?v=14"></script>
<script src="js/classes.js?v=9"></script>
<script src="js/common.js?v=15"></script>
<script src="js/bus.js?v=5"></script>
<script>
/* The driver's phone: the office sets the stops; the driver starts the trip and
   taps each stop as done. Parents see each tick straight away. */
(function () {
  const S = SJS, $ = (q) => document.querySelector(q), esc = S.esc;
  let id = new URLSearchParams(location.search).get("id");
  try { if (id) localStorage.setItem("sjs-staff", id.toUpperCase()); else id = localStorage.getItem("sjs-staff"); } catch (e) {}
  id = (id || "").toUpperCase();
  const me = S.STAFF[id];
  if (!me || me.role !== "driver") { location.replace("login.html?role=staff"); return; }
  document.querySelectorAll("[data-signout]").forEach((a) => a.addEventListener("click", () => { try { localStorage.removeItem("sjs-staff"); } catch (e) {} }));
  $("#who-av").textContent = me.initials; $("#who-name").textContent = me.name; $("#who-title").textContent = "Driver · " + id;

  let r = S.routeOfDriver(id), trip, live;
  if (!r) { $("#trip").innerHTML = `<h1 class="drv-h">No route yet</h1><p class="muted">The school office hasn't given you a route. Once they do, it shows here.</p>`; document.querySelectorAll(".drv-main > section:not(#trip)").forEach((x) => x.remove()); return; }
  const rider = S.ridersOf(r)[0];
  $("#proto").innerHTML = `<b>Prototype</b> · Driver view. Each stop you mark reaches parent pages open in this browser.` + (rider ? ` <a href="parent.html?kid=${rider.key}" target="_blank">Open ${esc(S.kid(rider.key).first)}'s parent view in a new tab</a>` : "");
  const mine = () => { const v = S.busLive(r.id); return v && v.by === id && !v.ended ? v : null; };
  live = mine(); trip = live ? live.trip : S.tripNow(r);
  const list = () => S.tripStops(r, trip);
  const kidsAt = (i) => S.ridersOf(r).filter((x) => x.stop === i).map((x) => (S.kid(x.key) || {}).name || x.key);
  const word = () => (trip === "am" ? "pick-up" : "drop");
  const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");

  function render() {
    const L = list(), on = !!live, n = on ? Math.min(live.next, L.length) : 0, done = on && n >= L.length;
    const stops = L.filter((s) => !s.school), kids = stops.reduce((a, s) => a + kidsAt(s.i).length, 0);
    const left = stops.filter((s, k) => !on || L.indexOf(s) >= n).reduce((a, s) => a + kidsAt(s.i).length, 0);
    const name = trip === "am" ? "Morning pick-up" : "Afternoon drop";
    $("#trip").innerHTML = `
      <div class="drv-top"><div><span class="drv-r">${esc(r.id)} · ${esc(r.bus)}${r.reg ? " · " + esc(r.reg) : ""}</span><h1 class="drv-h">${on ? name : "Ready for the " + (trip === "am" ? "morning" : "afternoon")}</h1></div>
      ${on ? `<span class="drv-on"><i></i>On the road</span>` : `<div class="seg" role="group" aria-label="Trip"><button type="button" data-trip="am" class="${trip === "am" ? "on" : ""}" aria-pressed="${trip === "am"}">Morning</button><button type="button" data-trip="pm" class="${trip === "pm" ? "on" : ""}" aria-pressed="${trip === "pm"}">Afternoon</button></div>`}</div>
      <div class="drv-sum">
        <div><b>${stops.length}</b><span>${stops.length === 1 ? "stop" : "stops"}</span></div>
        <div><b>${kids}</b><span>${trip === "am" ? "pick-ups" : "drops"}</span></div>
        <div><b>${on ? Math.max(0, stops.length - L.slice(0, n).filter((s) => !s.school).length) : stops.length}</b><span>stops left</span></div>
      </div>
      ${!on ? `<p class="drv-line">First stop <b>${esc(L[0].n)}</b> at ${S.ampm(L[0].t)}${trip === "pm" ? `, after leaving school at ${S.ampm(r.back)}` : ""}.</p>
        <button class="btn btn-primary drv-go" type="button" data-start>Start trip</button>`
      : done ? `<p class="drv-line"><b>All stops done.</b> ${trip === "am" ? "Reached school" : "Last drop"} at ${esc(live.reached[L.length - 1] || S.timeNow())}.</p><button class="btn btn-primary drv-go" type="button" data-end>Close the trip</button>`
      : `<p class="drv-line">${plural(left, word())} still to go. Tap <b>Done</b> on each stop as you leave it.</p>
        <button class="btn btn-ghost btn-sm" type="button" data-end>End trip early</button>`}`;
    $("#stops-n").textContent = `${trip === "am" ? "Morning" : "Afternoon"} · in order`;
    $("#stops").innerHTML = L.map((s, k) => {
      const st = on && k < n ? "done" : on && k === n ? "next" : "", ks = s.school ? [] : kidsAt(s.i);
      const who = s.school ? (trip === "am" ? "Everyone gets off" : "Leave school") : ks.length ? `${plural(ks.length, word())}: ${ks.map(esc).join(", ")}` : `No ${word()}s`;
      const act = st === "done" ? `<span class="ok">✓ ${esc(live.reached[k] || "")}</span>${k === n - 1 ? ` <button class="link-btn" type="button" data-undo>Undo</button>` : ""}`
        : st === "next" ? `<button class="btn btn-primary drv-done" type="button" data-done="${k}">Done</button>` : "";
      return `<li class="${st}${s.school ? " sch" : ""}"><span class="t">${S.ampm(s.t)}</span><span class="n">${esc(s.n)}<small>${who}</small></span><span class="c">${act}</span></li>`;
    }).join("");
  }

  // The bus sits at the last stop marked, so the parent page can place it.
  const push = () => { const L = list(), at = L[Math.max(0, Math.min(live.next, L.length) - 1)] || L[0]; live.lat = at.lat; live.lng = at.lng; live.at = Date.now(); S.setBusLive(r.id, live); };
  function start() {
    live = { by: id, trip, next: 0, reached: {}, start: Date.now(), at: Date.now(), manual: true };
    push(); render();
    S.toast("Trip started. Parents can see it now.");
  }
  function stop() { if (live) { live.ended = true; S.setBusLive(r.id, live); live = null; } S.toast("Trip closed."); render(); }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.trip) { trip = b.dataset.trip; render(); }
    else if (b.hasAttribute("data-start")) start();
    else if (b.dataset.done != null && live) { const L = list(), k = +b.dataset.done; live.reached[k] = S.timeNow(); live.next = k + 1; push(); render(); S.toast(`${L[k].n} done`); }
    else if (b.hasAttribute("data-undo") && live) { live.next = Math.max(0, live.next - 1); delete live.reached[live.next]; push(); render(); }
    else if (b.hasAttribute("data-end")) stop();
  });
  // The office may change the route while the driver is signed in.
  document.addEventListener("sjs:bus", () => { const nr = S.routeOfDriver(id); if (nr) r = nr; render(); });
  render();
})();
</script>
<script src="js/select.js?v=4"></script>
<script src="js/date.js?v=3"></script>
<script src="js/portal.js?v=1"></script>
<script src="js/feel.js?v=8"></script>
<script src="js/ease.js?v=6"></script>
</body>
</html>
